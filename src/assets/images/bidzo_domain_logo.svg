<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 35 350 375" fill="none">
  <defs>
    <!-- Metallic Chrome Bevel Gradients -->
    <linearGradient id="metal-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="25%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="75%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="metal-facet-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="metal-facet-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Deep Tech Navy Inlay Background -->
    <linearGradient id="tech-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1B33" />
      <stop offset="50%" stop-color="#071426" />
      <stop offset="100%" stop-color="#050E1C" />
    </linearGradient>

    <!-- Glowing Cyan Circuit Core -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Arrowhead Chrome Gradient -->
    <linearGradient id="arrow-left-facet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="arrow-right-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="40%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Subtle Drop Shadow & Glow Filters -->
    <filter id="soft-shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.22" />
    </filter>

    <filter id="cyan-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <!-- ================= BAR 1: LOWEST PILLAR (LEFT) ================= -->
    <g id="pillar-1">
      <!-- Metallic Outer Border Frame -->
      <rect x="30" y="260" width="60" height="140" rx="4" fill="url(#metal-outer)" />
      <!-- Beveled Inner Edge -->
      <rect x="32" y="262" width="56" height="136" rx="3" fill="#1E293B" />
      <rect x="34" y="264" width="52" height="132" rx="2" fill="url(#metal-facet-light)" />
      <!-- Dark Circuit Core Inlay -->
      <rect x="37" y="267" width="46" height="126" rx="1.5" fill="url(#tech-bg)" />

      <!-- Glowing Cyan Circuit Traces -->
      <g filter="url(#cyan-bloom)">
        <path d="M 46 385 L 46 320 L 58 308 L 58 275" stroke="#00F5FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="46" cy="385" r="2.2" fill="#38BDF8" />
        <circle cx="58" cy="275" r="2.2" fill="#E0F2FE" />

        <path d="M 68 385 L 68 335 L 56 323" stroke="#00F5FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="68" cy="385" r="2" fill="#38BDF8" />
      </g>

      <!-- Gold Secondary Circuit Traces -->
      <path d="M 72 370 L 72 310 L 64 302" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="72" cy="370" r="1.8" fill="#FCD34D" />

      <!-- SMD Resistor / Capacitor Component -->
      <rect x="42" y="340" width="8" height="4" rx="1" fill="#E2E8F0" />
      <rect x="44" y="341" width="4" height="2" fill="#00F5FF" />
    </g>

    <!-- ================= BAR 2: MEDIUM PILLAR (CENTER) ================= -->
    <g id="pillar-2">
      <!-- Metallic Outer Border Frame -->
      <rect x="105" y="200" width="60" height="200" rx="4" fill="url(#metal-outer)" />
      <!-- Beveled Inner Edge -->
      <rect x="107" y="202" width="56" height="196" rx="3" fill="#1E293B" />
      <rect x="109" y="204" width="52" height="192" rx="2" fill="url(#metal-facet-light)" />
      <!-- Dark Circuit Core Inlay -->
      <rect x="112" y="207" width="46" height="186" rx="1.5" fill="url(#tech-bg)" />

      <!-- Glowing Cyan Circuit Traces -->
      <g filter="url(#cyan-bloom)">
        <path d="M 122 385 L 122 290 L 134 278 L 134 215" stroke="#00F5FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="122" cy="385" r="2.2" fill="#38BDF8" />
        <circle cx="134" cy="215" r="2.2" fill="#E0F2FE" />

        <path d="M 144 385 L 144 315 L 132 303 L 132 285" stroke="#00F5FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="144" cy="385" r="2" fill="#38BDF8" />
      </g>

      <!-- Gold Secondary Circuit Traces -->
      <path d="M 150 365 L 150 255 L 142 247 L 142 220" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round" />
      <circle cx="150" cy="365" r="1.8" fill="#FCD34D" />
      <circle cx="142" cy="220" r="1.8" fill="#FCD34D" />

      <!-- Tech Chip Component -->
      <rect x="127" y="325" width="12" height="6" rx="1" fill="#1E293B" stroke="#94A3B8" stroke-width="0.8" />
      <rect x="130" y="326.5" width="6" height="3" fill="#00F5FF" />
    </g>

    <!-- ================= BAR 3 + U-TURN ARROW (RIGHT) ================= -->
    <g id="pillar-3-arrow">
      <!-- Continuous U-Shaped Outer Metallic Frame -->
      <path
        d="M 180 145 L 240 145 L 240 330 Q 240 355 260 355 Q 280 355 280 330 L 280 145 L 340 145 L 340 335 Q 340 400 260 400 Q 180 400 180 335 Z"
        fill="url(#metal-outer)"
      />
      <!-- Inner Bevel Transition -->
      <path
        d="M 183 148 L 237 148 L 237 330 Q 237 350 260 350 Q 283 350 283 330 L 283 148 L 337 148 L 337 335 Q 337 396 260 396 Q 183 396 183 335 Z"
        fill="#1E293B"
      />
      <path
        d="M 185 150 L 235 150 L 235 330 Q 235 347 260 347 Q 285 347 285 330 L 285 150 L 335 150 L 335 335 Q 335 393 260 393 Q 185 393 185 335 Z"
        fill="url(#metal-facet-light)"
      />

      <!-- Dark Tech Core Track (U-Loop Inlay) -->
      <path
        d="M 188 153 L 232 153 L 232 330 Q 232 343 260 343 Q 288 343 288 330 L 288 153 L 332 153 L 332 335 Q 332 389 260 389 Q 188 389 188 335 Z"
        fill="url(#tech-bg)"
      />

      <!-- Glowing Cyan Circuit Traces Inside U-Track & Arrow Stem -->
      <g filter="url(#cyan-bloom)">
        <!-- Left Pillar Circuits -->
        <path d="M 198 160 L 198 330 Q 198 375 260 375 Q 322 375 322 330 L 322 153" stroke="#00F5FF" stroke-width="2.4" stroke-linecap="round" fill="none" />
        <circle cx="198" cy="160" r="2.2" fill="#E0F2FE" />
        <circle cx="322" cy="153" r="2.2" fill="#E0F2FE" />

        <path d="M 212 165 L 212 325 Q 212 360 260 360 Q 308 360 308 325 L 308 153" stroke="#00F5FF" stroke-width="2" stroke-linecap="round" fill="none" />
        <circle cx="212" cy="165" r="2" fill="#38BDF8" />

        <path d="M 224 175 L 224 280 L 218 290" stroke="#00F5FF" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="224" cy="175" r="2" fill="#38BDF8" />
      </g>

      <!-- Gold Secondary Circuit Traces in Arrow Stem -->
      <path d="M 298 160 L 298 295 L 304 305" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round" />
      <circle cx="298" cy="160" r="1.8" fill="#FCD34D" />

      <!-- Tech Chip on Stem -->
      <rect x="315" y="240" width="10" height="5" rx="1" fill="#1E293B" stroke="#94A3B8" stroke-width="0.8" />
      <rect x="317" y="241.5" width="6" height="2" fill="#00F5FF" />
    </g>

    <!-- ================= PROMINENT METALLIC ARROWHEAD ================= -->
    <g id="arrowhead">
      <!-- Outer Arrowhead Bevel Base -->
      <polygon points="310,45 250,145 370,145" fill="url(#metal-outer)" />
      <!-- Beveled Inner Facets -->
      <polygon points="310,48 253,143 310,132" fill="url(#arrow-left-facet)" />
      <polygon points="310,48 367,143 310,132" fill="url(#arrow-right-facet)" />

      <!-- Crisp Center Spine Ridge -->
      <line x1="310" y1="46" x2="310" y2="132" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

      <!-- Arrowhead Inlaid Tech Core & Cyan Circuitry -->
      <g filter="url(#cyan-bloom)">
        <!-- Left Facet Tech Traces -->
        <line x1="285" y1="125" x2="295" y2="100" stroke="#00F5FF" stroke-width="2" stroke-linecap="round" />
        <circle cx="295" cy="100" r="2.2" fill="#E0F2FE" />
        <line x1="295" y1="100" x2="304" y2="80" stroke="#00F5FF" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="304" cy="80" r="2" fill="#FFFFFF" />

        <!-- Right Facet Tech Traces -->
        <line x1="335" y1="125" x2="325" y2="100" stroke="#00F5FF" stroke-width="2" stroke-linecap="round" />
        <circle cx="325" cy="100" r="2.2" fill="#38BDF8" />
        <line x1="325" y1="100" x2="316" y2="80" stroke="#00F5FF" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="316" cy="80" r="2" fill="#FFFFFF" />

        <!-- Luminous Cyan Glowing Tip Aura -->
        <polygon points="310,44 300,65 320,65" fill="#00F5FF" opacity="0.35" />
      </g>

      <!-- Crisp Metallic Rim Highlights -->
      <polyline points="250,145 310,45 370,145" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
    </g>
  </g>
</svg>
